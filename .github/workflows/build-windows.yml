name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller customtkinter

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --onefile --name "Elpis" --add-data "src;src" --paths "." --paths "src" --collect-all cryptography --hidden-import=cryptography --hidden-import=h2 --hidden-import=brotli --hidden-import=zstandard gui.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Elpis-Windows-EXE
        path: dist/Elpis.exe
