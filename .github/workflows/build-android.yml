name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        pip install -r requirements_mobile.txt

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev ninja-build

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Prepare Requirements for Flet
      run: |
        mv requirements.txt requirements_desktop.txt
        cp requirements_mobile.txt requirements.txt

    - name: Build Android APK
      run: |
        python -m flet build apk --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Elpis-Android-APK
        path: build/apk/*.apk
