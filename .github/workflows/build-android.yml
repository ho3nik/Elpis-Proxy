name: Build Elpis Mobile

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install flet

      - name: Prepare Mobile Requirements
        run: |
          # Replace the main requirements file so Flet processes the mobile dependencies
          # We check if requirements_desktop.txt exists (from previous runs) or use current requirements.txt
          if [ -f requirements.txt ] && [ ! -f requirements_desktop.txt ]; then
            mv requirements.txt requirements_desktop.txt
          fi
          cp requirements_mobile.txt requirements.txt

      - name: Build APK
        run: flet build apk --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elpis-Android-APK
          path: build/apk/**/*.apk
